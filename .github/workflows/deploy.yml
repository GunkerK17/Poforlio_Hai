name: Deploy portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build -- --base=/Poforlio_Hai/
        env:
          VITE_LEAD_DELIVERY: ${{ vars.VITE_LEAD_DELIVERY || 'email' }}
          VITE_LEAD_EMAIL: ${{ vars.VITE_LEAD_EMAIL || 'chihai11102003@gmail.com' }}
          VITE_LEAD_API_URL: ${{ vars.VITE_LEAD_API_URL }}
          VITE_LEAD_GOOGLE_SCRIPT_URL: ${{ vars.VITE_LEAD_GOOGLE_SCRIPT_URL }}
      - run: node scripts/pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
